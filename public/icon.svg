<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="50%" stop-color="#0E1528"/>
      <stop offset="100%" stop-color="#16203A"/>
    </linearGradient>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#34D399"/>
      <stop offset="70%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding for maskable icon -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Optical Collimator & Slit rays -->
  <g filter="url(#glow)">
    <!-- Central straight beam -->
    <line x1="80" y1="256" x2="432" y2="256" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.95"/>
    
    <!-- 1st Order diffracted rays (Left / Right) -->
    <line x1="256" y1="256" x2="420" y2="160" stroke="#34D399" stroke-width="4.5" stroke-opacity="0.9"/>
    <line x1="256" y1="256" x2="420" y2="352" stroke="#34D399" stroke-width="4.5" stroke-opacity="0.9"/>
    
    <!-- 2nd Order diffracted rays -->
    <line x1="256" y1="256" x2="390" y2="90" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.85"/>
    <line x1="256" y1="256" x2="390" y2="422" stroke="#EF4444" stroke-width="4" stroke-opacity="0.85"/>
  </g>

  <!-- Grating Glass Plate at center -->
  <rect x="246" y="120" width="20" height="272" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
  <!-- Grating Micro-rulings (15,000 LPI representation) -->
  <line x1="250" y1="140" x2="262" y2="140" stroke="#38BDF8" stroke-width="2"/>
  <line x1="250" y1="160" x2="262" y2="160" stroke="#38BDF8" stroke-width="2"/>
  <line x1="250" y1="180" x2="262" y2="180" stroke="#38BDF8" stroke-width="2"/>
  <line x1="250" y1="200" x2="262" y2="200" stroke="#38BDF8" stroke-width="2"/>
  <line x1="250" y1="220" x2="262" y2="220" stroke="#38BDF8" stroke-width="2"/>
  <line x1="250" y1="240" x2="262" y2="240" stroke="#38BDF8" stroke-width="2"/>
  <line x1="250" y1="260" x2="262" y2="260" stroke="#38BDF8" stroke-width="2"/>
  <line x1="250" y1="280" x2="262" y2="280" stroke="#38BDF8" stroke-width="2"/>
  <line x1="250" y1="300" x2="262" y2="300" stroke="#38BDF8" stroke-width="2"/>
  <line x1="250" y1="320" x2="262" y2="320" stroke="#38BDF8" stroke-width="2"/>
  <line x1="250" y1="340" x2="262" y2="340" stroke="#38BDF8" stroke-width="2"/>
  <line x1="250" y1="360" x2="262" y2="360" stroke="#38BDF8" stroke-width="2"/>

  <!-- Spectral order focal dots on screen -->
  <circle cx="432" cy="256" r="10" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="420" cy="160" r="8" fill="#34D399" filter="url(#glow)"/>
  <circle cx="420" cy="352" r="8" fill="#34D399" filter="url(#glow)"/>
  <circle cx="390" cy="90" r="7" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="390" cy="422" r="7" fill="#EF4444" filter="url(#glow)"/>

  <!-- Spectrometer Vernier Ring Arc -->
  <path d="M 120 380 A 180 180 0 0 1 120 132" fill="none" stroke="#FBBF24" stroke-width="4" stroke-dasharray="6,8" stroke-opacity="0.6"/>
</svg>
